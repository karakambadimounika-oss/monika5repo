{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Live Order Tracking</title>

    <link rel="stylesheet"
          href="{% static 'foodapp/css/style.css' %}">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* Navbar */

        nav{
            background:#ff5722;
            color:white;
            padding:20px 50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav h1{
            font-size:42px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:30px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-size:22px;
        }

        nav ul li a:hover{
            color:#ffe0d6;
        }

        /* Tracking Box */

        .tracking-container{

            width:80%;
            max-width:950px;

            margin:80px auto;

            background:white;

            padding:60px;

            border-radius:25px;

            box-shadow:0 10px 30px rgba(0,0,0,0.15);

            text-align:center;
        }

        .tracking-container h1{

            color:#ff5722;

            font-size:65px;

            margin-bottom:20px;
        }

        .tracking-container p{

            font-size:26px;

            margin-bottom:60px;

            color:#555;
        }

        /* Progress Bar */

        .progress-bar{

            position:relative;

            display:flex;

            justify-content:space-between;

            align-items:center;

            margin-top:50px;
        }

        .progress-line{

            position:absolute;

            top:35px;

            left:0;

            width:100%;

            height:8px;

            background:#ddd;

            z-index:1;

            border-radius:10px;
        }

        .progress-fill{

            position:absolute;

            top:35px;

            left:0;

            width:0%;

            height:8px;

            background:#4caf50;

            z-index:2;

            border-radius:10px;

            transition:2s;
        }

        /* Steps */

        .step{

            position:relative;

            z-index:3;

            width:25%;
        }

        .circle{

            width:75px;

            height:75px;

            border-radius:50%;

            background:#ddd;

            margin:auto;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:32px;

            color:white;

            transition:0.5s;
        }

        .active .circle{

            background:#4caf50;

            transform:scale(1.1);
        }

        .step h3{

            margin-top:18px;

            font-size:22px;

            color:#333;
        }

        /* Status Text */

        .status-text{

            margin-top:60px;

            font-size:34px;

            color:#ff5722;

            font-weight:bold;
        }

    </style>

</head>

<body>

<!-- Navbar -->

<nav>

    <h1>🍔 FoodieExpress</h1>

    <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/restaurent/">Restaurants</a></li>
        <li><a href="/cart/">Cart</a></li>
    </ul>

</nav>

<!-- Tracking Section -->

<div class="tracking-container">

    <h1>Live Order Tracking</h1>

    <p>Your delicious food is on the way 🚀</p>

    <div class="progress-bar">

        <div class="progress-line"></div>

        <div class="progress-fill" id="progressFill"></div>

        <!-- Step 1 -->

        <div class="step active" id="step1">

            <div class="circle">✓</div>

            <h3>Order Confirmed</h3>

        </div>

        <!-- Step 2 -->

        <div class="step" id="step2">

            <div class="circle">👨‍🍳</div>

            <h3>Preparing Food</h3>

        </div>

        <!-- Step 3 -->

        <div class="step" id="step3">

            <div class="circle">🛵</div>

            <h3>Out for Delivery</h3>

        </div>

        <!-- Step 4 -->

        <div class="step" id="step4">

            <div class="circle">🎉</div>

            <h3>Delivered</h3>

        </div>

    </div>

    <!-- Live Status -->

   <div class="status-text" id="statusText">

    Order Confirmed ✅

</div>

<br><br>

<a href="/feedback/">

    <button style="
        padding:15px 25px;
        border:none;
        border-radius:12px;
        background:#ff5722;
        color:white;
        font-size:20px;
        cursor:pointer;
    ">

        Give Feedback

    </button>

</a>
</div>

<script>

    let progress = document.getElementById("progressFill");

    let statusText = document.getElementById("statusText");

    // Preparing

    setTimeout(() => {

        document.getElementById("step2").classList.add("active");

        progress.style.width = "33%";

        statusText.innerHTML =
            "Food is being prepared 👨‍🍳";

    }, 3000);

    // Delivery

    setTimeout(() => {

        document.getElementById("step3").classList.add("active");

        progress.style.width = "66%";

        statusText.innerHTML =
            "Order is out for delivery 🛵";

    }, 6000);

    // Delivered

    setTimeout(() => {

        document.getElementById("step4").classList.add("active");

        progress.style.width = "100%";

        statusText.innerHTML =
            "Order Delivered Successfully 🎉";

    }, 9000);

</script>

</body>
</html>
