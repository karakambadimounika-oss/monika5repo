{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Foodie Express Login</title>

    <link rel="stylesheet"
          href="{% static 'foodapp/css/style.css' %}">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <!-- Changed Heading -->
        <h1 class="title">Food Express</h1>

        <p>Login to continue ordering delicious food</p>

        <!-- Added action for redirect -->
        <form action="{% url 'home' %}" method="post">

            {% csrf_token %}

            <input type="email"
                   placeholder="Enter Email"
                   name="email"
                   required>

            <input type="password"
                   placeholder="Enter Password"
                   name="password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
