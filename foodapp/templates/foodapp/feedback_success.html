<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Feedback Submitted</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .success-box{

            background:white;
            width:500px;
            padding:50px;
            border-radius:25px;
            text-align:center;

            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .success-icon{

            font-size:90px;
            margin-bottom:20px;
        }

        h1{

            color:#ff5722;
            margin-bottom:15px;
            font-size:42px;
        }

        p{

            color:#555;
            font-size:22px;
            margin-bottom:35px;
        }

        .home-btn{

            text-decoration:none;
        }

        .home-btn button{

            padding:15px 35px;
            border:none;
            border-radius:12px;

            background:#ff5722;
            color:white;

            font-size:20px;
            cursor:pointer;

            transition:0.3s;
        }

        .home-btn button:hover{

            background:#e64a19;
            transform:scale(1.05);
        }

    </style>

</head>

<body>

    <div class="success-box">

        <div class="success-icon">
            ✅
        </div>

        <h1>Thank You!</h1>

        <p>
            Your feedback has been submitted successfully.
        </p>

        <a href="/home/" class="home-btn">

            <button>
                Back To Home
            </button>

        </a>

    </div>

</body>
</html>
