{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FoodieExpress Feedback</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            background:linear-gradient(to right,#ffecd2,#fcb69f);

            min-height:100vh;

            padding-top:120px;
        }

        /* NAVBAR */

        nav{

            width:100%;

            background:#ff5722;

            padding:20px 60px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            position:fixed;

            top:0;

            left:0;

            z-index:1000;

            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        nav h1{

            color:white;

            font-size:45px;
        }

        nav ul{

            display:flex;

            list-style:none;

            gap:35px;
        }

        nav ul li a{

            color:white;

            text-decoration:none;

            font-size:24px;

            transition:0.3s;
        }

        nav ul li a:hover{

            color:#ffe0d5;
        }

        /* FEEDBACK CONTAINER */

        .feedback-wrapper{

            display:flex;

            justify-content:center;

            align-items:center;

            padding:40px;
        }

        .feedback-container{

            width:90%;
            max-width:650px;

            background:white;

            padding:50px;

            border-radius:25px;

            box-shadow:0 10px 30px rgba(0,0,0,0.2);

            text-align:center;
        }

        .feedback-container h1{

            color:#ff5722;

            font-size:50px;

            margin-bottom:15px;
        }

        .feedback-container p{

            color:#666;

            font-size:22px;

            margin-bottom:35px;
        }

        form{

            display:flex;

            flex-direction:column;

            gap:20px;
        }

        input,
        textarea{

            padding:18px;

            border:2px solid #eee;

            border-radius:15px;

            font-size:18px;

            outline:none;

            transition:0.3s;
        }

        input:focus,
        textarea:focus{

            border-color:#ff5722;
        }

        textarea{

            height:140px;

            resize:none;
        }

        /* STAR RATING */

        .stars{

            display:flex;

            justify-content:center;

            gap:10px;

            margin-top:10px;
        }

        .star{

            font-size:50px;

            cursor:pointer;

            color:#ccc;

            transition:0.3s;
        }

        .star:hover{

            transform:scale(1.2);
        }

        .star.active{

            color:gold;

            transform:scale(1.2);
        }

        #rating-text{

            margin-top:15px;

            font-size:22px;

            color:#444;

            font-weight:bold;
        }

        /* BUTTON */

        button{

            padding:18px;

            border:none;

            border-radius:15px;

            background:#ff5722;

            color:white;

            font-size:22px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            background:#e64a19;

            transform:scale(1.03);
        }

        /* MOBILE */

        @media(max-width:700px){

            nav{

                flex-direction:column;

                gap:20px;

                padding:20px;
            }

            nav h1{

                font-size:35px;
            }

            nav ul{

                gap:20px;
            }

            nav ul li a{

                font-size:18px;
            }

            .feedback-container{

                padding:30px;
            }

            .feedback-container h1{

                font-size:38px;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav>

    <h1>🍔 FoodieExpress</h1>

    <ul>

        <li><a href="/home/">Home</a></li>

        <li><a href="/restaurants/">Restaurants</a></li>

        <li><a href="/cart/">Cart</a></li>

        <li><a href="/tracking/">Tracking</a></li>

    </ul>

</nav>

<!-- FEEDBACK FORM -->

<div class="feedback-wrapper">

<div class="feedback-container">

    <h1>⭐ Give Feedback</h1>

    <p>
        Tell us about your food experience
    </p>

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               placeholder="Enter Your Name"
               required>

        <input type="email"
               placeholder="Enter Your Email"
               required>

        <textarea placeholder="Write your feedback here..."
                  required></textarea>

        <!-- STAR RATING -->

        <div class="stars">

            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>

        </div>

        <p id="rating-text">
            Your Rating: 0 Stars
        </p>

        <!-- HIDDEN INPUT -->

        <input type="hidden"
               id="rating-value"
               name="rating">

        <button type="submit">

            Submit Feedback

        </button>

    </form>

</div>

</div>

<script>

const stars =
document.querySelectorAll(".star");

const ratingText =
document.getElementById("rating-text");

const ratingValue =
document.getElementById("rating-value");

let currentRating = 0;

stars.forEach((star,index)=>{

    star.addEventListener("click",()=>{

        currentRating = index + 1;

        ratingValue.value = currentRating;

        stars.forEach((s,i)=>{

            if(i < currentRating){

                s.classList.add("active");

            }else{

                s.classList.remove("active");
            }

        });

        ratingText.innerText =
        "Your Rating: " +
        currentRating +
        " Stars ⭐";

    });

});

</script>

</body>
</html>
