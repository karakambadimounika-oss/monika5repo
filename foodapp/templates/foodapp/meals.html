{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meals Point</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        /* NAVBAR */

        nav{
            background:#ff5722;
            padding:20px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        nav h1{
            color:white;
            font-size:40px;
        }

        nav ul{
            display:flex;
            list-style:none;
            gap:30px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            font-size:22px;
        }

        /* TITLE */

        .title{
            text-align:center;
            font-size:55px;
            color:#ff5722;
            margin:40px 0;
        }

        /* GRID */

        .menu-container{
            width:90%;
            margin:auto;
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:30px;
            padding-bottom:60px;
        }

        /* CARD */

        .menu-card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .menu-card:hover{
            transform:translateY(-10px);
        }

        .menu-card img{
            width:100%;
            height:240px;
            object-fit:cover;
        }

        .menu-details{
            padding:20px;
            text-align:center;
        }

        .menu-details h2{
            font-size:30px;
            margin-bottom:10px;
        }

        .price{
            font-size:25px;
            color:#444;
            margin-bottom:15px;
        }

        .add-btn{
            padding:12px 25px;
            border:none;
            border-radius:10px;
            background:#ff5722;
            color:white;
            font-size:18px;
            cursor:pointer;
        }

        .add-btn:hover{
            background:#e64a19;
        }

        @media(max-width:900px){

            .menu-container{
                grid-template-columns:repeat(2,1fr);
            }
        }

        @media(max-width:600px){

            .menu-container{
                grid-template-columns:1fr;
            }
        }

    </style>

</head>

<body>

<!-- NAVBAR -->

<nav>
